[pytest]
testpaths = tests
addopts = -p no:cacheprovider --import-mode=importlib
norecursedirs = results
markers =
    yamlql: exercises the yamlql command-line interface
    yamlpath: exercises yamlpath command-line tools
    batch: covers multi-operation batch behavior
    hybrid: covers yamlql and yamlpath fallback behavior
    gap: documents a proven limitation that must continue to hold
    slow: runs a comparatively slow external operation
    concurrency: covers concurrent process behavior
    acceptance: end-to-end acceptance coverage
    perf: performance characterization
